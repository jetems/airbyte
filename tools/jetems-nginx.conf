# tools/jetems-nginx.conf —— jetems 本地反向代理（复刻生产 Ingress 的 /auth 路由）
# 浏览器统一访问 http://localhost:8000：
#   /auth/* → keycloak:8100（keycloak 以 --http-relative-path=/auth 提供服务）
#   其余    → airbyte-server:8001（API + SPA 静态资源）
# 目的：让 OIDC discovery / 授权 / token 交换与应用同源，issuer 一致，无 CORS。
events {}

http {
  # keycloak 的 .well-known、token 等响应可能较大，放宽缓冲
  proxy_buffers 16 64k;
  proxy_buffer_size 64k;

  server {
    listen 80;
    server_name localhost;

    # ── Keycloak（认证）──
    location /auth/ {
      proxy_pass http://keycloak:8100;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  8000;
    }

    # ── Airbyte Server（API + 前端）──
    location / {
      proxy_pass http://server:8001;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
